name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (stdlib-only package + pytest)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e . "pytest==9.2.0"
      - name: Test suite
        run: .venv/bin/python -m pytest -q
      - name: Test suite with the network blocked
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces by default; allow them for unshare -rn.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rn .venv/bin/python -m pytest -q -rs -m 'not p00_outer'
