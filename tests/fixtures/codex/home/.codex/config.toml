model = "gpt-5-pro"
model_reasoning_effort = "max"
plan_mode_reasoning_effort = "ultra"
service_tier = "fast"
project_doc_max_bytes = 32768

[features]
multi_agent = true

[agents]
max_threads = 8

[mcp_servers.docs]
command = "docs-mcp"
enabled = true

[mcp_servers.search]
command = "search-mcp"
# enabled defaults to on
